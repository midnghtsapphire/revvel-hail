<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Strata — Step 2 Gap Fill</title>
<style>
body { margin:0; background:#0c0c0b; color:#f3f1ea; font-family:system-ui; }
#map { width:100%; height:70vh; background:#1a1a18; position:relative; }
.controls { padding:12px; }
button { background:#333; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; margin:4px; }
.gap { position:absolute; background:#444; width:80px; height:60px; border:2px dashed #888; }
.filled { background:#2d5a3d !important; border-style:solid; }
</style>
</head>
<body>
<div class="controls">
  <h1>Step 2 — Mapping Driver + Gap Fill</h1>
  <p>Click Run Driver. The gap becomes navigable. You can ignore the driver.</p>
  <button onclick="runDriver()">Run Driver</button>
  <div id="status">Gap present. Not yet navigable.</div>
</div>
<div id="map"><div id="gap" class="gap" style="left:40%;top:40%"></div></div>
<script>
function runDriver() {
  document.getElementById('gap').classList.add('filled');
  document.getElementById('status').textContent = 'Driver pass complete. Gap is now navigable. Player can ignore driver and move on.';
}
</script>
</body>
</html>
