<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Step 2 — Mapping Driver + Gap Fill</title>
<style>body{font-family:system-ui;background:#0c0c0b;color:#f3f1ea;margin:1rem} .card{background:#161616;padding:1rem;margin:1rem 0;border-radius:8px} button{background:#2a2a2a;color:#f3f1ea;border:1px solid #444;padding:.5rem 1rem;cursor:pointer} #map{height:50vh;background:#1a1a1a;position:relative;margin:1rem 0} .gap{position:absolute;background:#444;opacity:.7} .filled{background:#3a5a3a}</style></head>
<body>
<h1>Step 2: Mapping Driver + Gap Fill</h1>
<p>Done when a gap becomes navigable after the driver pass and the player can ignore the driver.</p>
<div id="map">
  <div class="gap" id="gap" style="left:40%;top:30%;width:20%;height:25%;"></div>
</div>
<div class="card">
  <button onclick="runDriver()">Run mapping driver</button>
  <button onclick="ignore()">Ignore driver (still navigable)</button>
  <span id="status">Gap present. Click Run driver.</span>
</div>
<script>
function runDriver(){
  document.getElementById("gap").className="filled";
  document.getElementById("status").textContent="Driver pass complete. Gap is now navigable. You can ignore the driver.";
}
function ignore(){
  document.getElementById("status").textContent="Driver ignored. Patch remains navigable from public data.";
}
</script>
</body></html>
